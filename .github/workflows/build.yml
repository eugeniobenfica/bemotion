name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git patch
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-gn
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-svg mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-harfbuzz mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-libjpeg-turbo mingw-w64-ucrt-x86_64-libwebp mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-expat mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-nsis

      - name: Cache Skia
        id: skia
        uses: actions/cache@v6
        with:
          path: third_party/skia
          key: skia-windows-${{ hashFiles('tools/skia/**') }}

      - name: Build Skia
        if: steps.skia.outputs.cache-hit != 'true'
        run: bash -x tools/skia/build-skia.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (build)
        run: tools/smoke-test.sh build smoke

      - name: Benchmarks
        # Reported every time (bench.json in the smoke test output); the limits only catch a
        # big regression, as shared runners are slow and noisy.
        run: python3 tools/bench.py build --json smoke/bench.json --max-startup 20 --max-frame-ms 500 --min-export-fps 3

      - name: Package
        run: tools/package-windows.sh build dist

      - name: Smoke test (package)
        run: tools/smoke-test.sh dist/bemotion smoke-package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: bemotion-windows
          path: |
            dist/bemotion-*-setup.exe
            dist/bemotion-*-portable.zip

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bemotion-windows-smoke
          path: |
            smoke/*.png
            smoke/bench.json
            smoke-package/*.png
            smoke/welcome.mp4
            build/tests/golden/*.png

  linux:
    name: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang python3 pkg-config ffmpeg qmake6 file \
            qt6-base-dev qt6-base-private-dev qt6-base-dev-tools qt6-qpa-plugins libqt6svg6-dev libgl-dev libxkbcommon-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libswresample-dev libavutil-dev \
            libharfbuzz-dev libicu-dev libfreetype-dev libfontconfig-dev \
            libpng-dev libjpeg-dev libwebp-dev libexpat1-dev zlib1g-dev

      - name: Cache Skia
        id: skia
        uses: actions/cache@v6
        with:
          path: third_party/skia
          key: skia-linux-${{ hashFiles('tools/skia/**') }}

      - name: Build Skia
        if: steps.skia.outputs.cache-hit != 'true'
        run: bash -x tools/skia/build-skia.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBEMOTION_FETCH_WHISPER=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (build)
        run: tools/smoke-test.sh build smoke

      - name: Benchmarks
        # Reported every time (bench.json in the smoke test output); the limits only catch a
        # big regression, as shared runners are slow and noisy.
        run: python3 tools/bench.py build --json smoke/bench.json --max-startup 20 --max-frame-ms 500 --min-export-fps 3

      - name: Package
        run: tools/package-linux.sh build dist

      - name: Smoke test (package)
        run: tools/smoke-test.sh dist/AppDir/usr/bin smoke-package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: bemotion-linux
          path: dist/bemotion-x86_64.AppImage

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bemotion-linux-smoke
          path: |
            smoke/*.png
            smoke/bench.json
            smoke-package/*.png
            smoke/welcome.mp4
            build/tests/golden/*.png

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install ninja pkgconf qt ffmpeg harfbuzz icu4c freetype fontconfig libpng jpeg-turbo webp
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix jpeg-turbo)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Cache Skia
        id: skia
        uses: actions/cache@v6
        with:
          path: third_party/skia
          key: skia-macos-${{ hashFiles('tools/skia/**') }}

      - name: Build Skia
        if: steps.skia.outputs.cache-hit != 'true'
        run: bash -x tools/skia/build-skia.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DBEMOTION_FETCH_WHISPER=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (build)
        run: tools/smoke-test.sh build smoke

      - name: Benchmarks
        # Reported every time (bench.json in the smoke test output); the limits only catch a
        # big regression, as shared runners are slow and noisy.
        run: python3 tools/bench.py build --json smoke/bench.json --max-startup 20 --max-frame-ms 500 --min-export-fps 3

      - name: Package
        run: tools/package-macos.sh build dist

      - name: Smoke test (package)
        run: tools/smoke-test.sh dist/bemotion.app/Contents/MacOS smoke-package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: bemotion-macos
          path: dist/bemotion.dmg

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bemotion-macos-smoke
          path: |
            smoke/*.png
            smoke/bench.json
            smoke-package/*.png
            smoke/welcome.mp4
            build/tests/golden/*.png

  sanitizers:
    name: linux (address and undefined behavior sanitizers, fuzz)
    runs-on: ubuntu-24.04
    env:
      # Leaks are left to the other checks: Qt and fontconfig keep caches until exit.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang python3 pkg-config ffmpeg qmake6 file \
            qt6-base-dev qt6-base-private-dev qt6-base-dev-tools qt6-qpa-plugins libqt6svg6-dev libgl-dev libxkbcommon-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libswresample-dev libavutil-dev \
            libharfbuzz-dev libicu-dev libfreetype-dev libfontconfig-dev \
            libpng-dev libjpeg-dev libwebp-dev libexpat1-dev zlib1g-dev

      - name: Cache Skia
        id: skia
        uses: actions/cache@v6
        with:
          path: third_party/skia
          key: skia-linux-${{ hashFiles('tools/skia/**') }}

      - name: Build Skia
        if: steps.skia.outputs.cache-hit != 'true'
        run: bash -x tools/skia/build-skia.sh

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: tools/smoke-test.sh build smoke

      - name: Fuzz (2 minutes)
        working-directory: build
        run: |
          fuzz="$(find . -maxdepth 3 -type f -name bemotion_fuzz | head -1)"
          "$fuzz" --seconds 120

      - name: Upload what failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bemotion-sanitizers-failure
          path: |
            build/fuzz-failure.*
            build/tests/golden/*.png
            smoke/*.png

  format:
    name: clang-format (changed lines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      # Only the lines a change touches: older code is formatted as it is edited.
      # libs/bestyle and third_party follow their own repositories.
      - name: Check
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$base^{commit}" 2>/dev/null || base="$(git rev-parse HEAD~1)"
          out="$(git clang-format --diff --extensions c,cc,cpp,h,hpp "$base" -- src tests 2>&1)" || true
          echo "$out"
          case "$out" in
            *"did not modify any files"*|*"no modified files to format"*|"") ;;
            *) echo "::error::Changed lines are not clang-format clean: apply the diff above (git clang-format $base)"; exit 1 ;;
          esac
