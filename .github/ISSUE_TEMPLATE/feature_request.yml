name: Feature request
description: An idea to make bemotion better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The goal, in your own words. What are you trying to animate or achieve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: How other tools (After Effects, Premiere, Figma…) handle it is useful context.
  - type: checkboxes
    id: plugin
    attributes:
      label: Scope
      options:
        - label: This could also be a plugin (see docs/PLUGINS.md)
